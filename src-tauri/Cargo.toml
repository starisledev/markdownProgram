[package]
name = "markora"
version = "1.1.0"
description = "Typora 风格的所见即所得 Markdown 编辑器（Electron 版 Rust/Tauri v2 重构）"
authors = ["Markora"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "markora_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Markdown -> HTML 渲染（Rust 端承担导出与主进程渲染能力）
pulldown-cmark = "0.13"
# 原生“打开文件夹 / 另存为”对话框（Windows 上为 Win32 原生对话框）
rfd = "0.15"
